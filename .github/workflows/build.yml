name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vercel-install:
    name: Install like Vercel, then build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run build
      - run: test -f .vercel/output/config.json && test -f .vercel/output/static/brand/logo.jpg
